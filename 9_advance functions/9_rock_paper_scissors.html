<!DOCTYPE html>
<html>
<head>
  <title>Rock Paper Scissor</title>
  <link rel="stylesheet" href="9_rps.css">
</head>
<body>
  <h1>
    Rock Paper Scissors
  </h1>
  <button class="move-button js-rock-button">
    <img src="../projects/rps images/Rock.png" class="move-icon-rock">
  </button>

  <button class="move-button js-paper-button">
      <img src="../projects/rps images/Paper.png" class="move-icon-paper">
  </button>

  <button class="move-button js-scissor-button">
      <img src="../projects/rps images/Scissor.png" class="move-icon-scissor">
  </button>

  <p class="js-result-display result-display">
  </p>

  <p class = "js-choice-display choice-display">
  </p>

  <p class = "js-score-display score-display" >
  </p>

  <button class="reset-score-button js-reset-score-button"> 
    Reset Score
  </button>
  <button class="auto-play-button js-auto-play-button">
    Auto play
  </button>
  <div class="js-reset-confirmation reset-confirmation">

  </div>
  <script src="9_rps.js">
  </script>
</body>
</html>
