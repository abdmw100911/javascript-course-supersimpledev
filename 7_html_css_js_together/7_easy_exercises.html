<!DOCTYPE html>
<html>
<head>
  <title>HTML CSS EASY EXERCISES</title>
  <style>
    .amazon-button{
      background-color: rgb(255,216,20);
      padding:10px 50px;
      border:none;
      border-radius:20px;
      display: block;
    }
    .uber-button1{
      background-color: black;
      color: white;
      padding:10px 20px;
      border:none;
      border-radius:5px;
      margin-right:20px;
      font-weight: bold;
      cursor: pointer;
    }
    .uber-button2{
      background-color: rgb(230,230,230);
      padding:10px 20px;
      border:none;
      border-radius:5px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button class="amazon-button">
    Add to Cart
  </button>
  <br>
  <button class="uber-button1">
    Request Now
  </button>
  <button class="uber-button2">
    Schedule for Later
  </button>
</body>
</html>
