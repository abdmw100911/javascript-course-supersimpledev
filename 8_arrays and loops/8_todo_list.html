<!DOCTYPE html>
<html>
  <head>
    <title>TODO-LIST</title>
    <style>
      body{
        font-family: Arial, Helvetica, sans-serif;
      }
      .name-input{
        font-size: 15px;
        padding:6px;
      }
      .date-input{
        font-size: 15px;
        padding: 6px;
      }
      .add-button{
        background-color: black;
        color: white;
        border:none;
        font-size:15px;
        padding: 8px 30px;
        cursor: pointer;
        transition:opacity 0.15s;
      }
      .add-button:hover{
        opacity: 0.9;
      }
      .add-button:active{
        opacity: 1;
      }
      .done-button{
        background-color: green;
        color: white;
        border:none;
        font-size:15px;
        padding: 8px 30px;
        cursor: pointer;
        transition:opacity 0.15s;
      }
      .done-button:hover{
        opacity: 0.9;
      }
      .done-button:active{
        opacity: 1;
      }
      .todo-grid,.todo-input-grid{
        display:grid;
        grid-template-columns: 200px 150px 100px;
        column-gap: 10px;
        row-gap:10px;
        align-items:center;
      }
      .todo-input-grid{
        margin-bottom:10px;
      }
    </style>
  </head>
  <body>

    <p>To Do List</p>

    <div class="todo-input-grid">
      <input type="text" placeholder="Todo name" class="js-name-input name-input">

      <input type="date" class="js-date-input date-input">

      <button onclick="
      addTodo();
      " class="add-button">
        Add
      </button>
    </div>
    
    <div class = "js-display todo-grid"></div>

    <script src="8_todo_list.js">
    </script>

  </body>
</html>
