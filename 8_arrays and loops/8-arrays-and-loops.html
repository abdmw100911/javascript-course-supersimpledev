      //break and continue in loop

      for(let i=1;i<=10;i++){
        if(i===3){
          continue;
          //will skip one iteration in the loop
          //after continue it will not execute the below code
        }
        console.log(i);
        if(i===8){
          break;
        }
      }

      //skip a number if it is divisible by 3
      for(let i=1;i<=20;i++){
        if(i%3===0){
          continue;
        }
        console.log(i);
      }

      //same using a while loop
      let i=1;
      while(i<=20){
        if(i%3 === 0){
          //we have to add i++ manually to avoid infinite loop
          i++;
          continue;
        }
        console.log(i);
        i++;
      }
