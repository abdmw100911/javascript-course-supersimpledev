      //looping through an array 
      const todoList = ['make dinner', 'wash dishes', 'watch yt'];
      for(let i=0;i<todoList.length;i++){
        console.log(todoList[i]);
      }

      //accumulator pattern
      //create a var to store result 
      //loop through arrray and update the result
      const num = [1,1,3];
      let sum = 0;
      for(let i=0;i<num.length;i++){
        sum += num[i];
      }
      console.log(sum);

      //doubling the numbers in the array 
      const doubledArray = [];
      let doubledNum = 0;
      for(let i=0;i<num.length;i++){
        doubledNum = num[i]*2;
        doubledArray.push(doubledNum)
      }
      console.log(num);
      console.log(doubledArray);
