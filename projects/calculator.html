<!DOCTYPE html>
<html>
<head>
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="styles/calculator.css">
</head>
<body onkeydown="handleKey(event);">
  <p class = "js-calculation calculation"></p>
  <div class="buttons">
    <button onclick="
    stringGeneration('1');
      ">1
      </button>
    <button onclick="
      stringGeneration('2');
      ">2
      </button>
    <button onclick="
      stringGeneration('3');
      ">3
      </button>
    <button onclick="
      stringGeneration('+');
      " class="operation-button">+
      </button>
      
      <button onclick="
      stringGeneration('4');
      ">4
      </button>
    <button onclick="
      stringGeneration('5');
      ">5
      </button>
    <button onclick="
      stringGeneration('6');
      ">6
      </button>
    <button onclick="
      stringGeneration('-');
      " class="operation-button">-
    </button>

      <button onclick="
      stringGeneration('7');
      ">7
      </button>
    <button onclick="
      stringGeneration('8');
      ">8
      </button>
    <button onclick="
      stringGeneration('9');
      ">9
      </button>
    <button onclick="
      stringGeneration('*');
      " class="operation-button">X
    </button>

    <button onclick="
      stringGeneration('0');
      "
      >0
      </button>
    <button onclick="
      stringGeneration('.');
      ">.
      </button>
    <button onclick="
      calculate();
      " class="operation-button">=
      </button>
    <button onclick="
      stringGeneration('/');
      " class="operation-button">/
    </button>

    <button onclick="
    clearString();
      " class="clear-button">Clear
      </button>
  </div>

  <script src="scripts/calculator.js">
  
  </script>
</body>
</html>
