<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIMATION</title>
    <style>
        @keyframes moveRight{
            from{transform:translateX(0);}
            to{transform:translateX(100px);}
        }
        @keyframes moveLeft{
            from{
                transform:translateX(0);
            }
            to{
                transform:translateX(-75px);
            }
        }
        @keyframes shakeButton{
            0%   { transform: translateX(0); }
            25%  { transform: translateX(-5px); }
            50%  { transform: translateX(5px); }
            75%  { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        @keyframes appear {
            from {
                opacity:0;
            }
            to{
                opacity:1;
            }
        }
        .move-right-button{
            animation: moveRight 2s ;
        }
        .move-left-button{
            animation :moveLeft 2s ;
        }
        .shake-button{
            animation: shakeButton 1s;
        }
        .appear-button{
            /*animation: name duration timing-function fill-mode;*/
            animation: appear 1s ease forwards ;
        }
    </style>
</head>
<body>
    <button class="move-right-button">
        move right
    </button>
    <button class="move-left-button">
        move left
    </button>
    <button class="shake-button">
        Shake button
    </button>
    <button class="appear-button">
        fade appear button
    </button>
</body>
</html>
